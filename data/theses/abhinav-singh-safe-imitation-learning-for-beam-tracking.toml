body_html = '''
<p>The envisioned transition to 5G and 6G technologies have started to transform the properties of established communication networks. In the core of this transformation lies the capability of Base Stations (BSs) to utilize directional beams for transmission towards User Equipment (UE) served by the network. Here, a (large) library of pre-determined directional beams (called the codebook) is available, and the question is which beam needs to serve a specific UE at any point in time.</p>

<p>Of course, this problem becomes more complicated when the UEs are moving in given trajectories, in which case the BS needs to decide in real-time which beam needs to be used for tracking the UE – a problem called Beam Tracking [1]. Several approaches have been proposed, but among the most promising ones is Imitation Learning (IL) [2]. Here, we assume that an expert (i.e., a module that can determine the best serving beam by utilizing additional information) is available, but invoking it is expensive. Our goal is to distill the decision strategy of the expert in a student module (usually a neural network called a controller or a policy) that has low inference complexity.</p>

<p>This teacher-student training setup facilitates the student to make serval mistakes that the expert can retrospectively correct, in an algorithm first referred to as Dagger in literature [2]. This implies though that there is a performance loss until the student network starts to approximate the expert performance, which could be detrimental for the network performance. To alleviate this problem, a plethora of safe imitation learning approaches have been proposed [3-6].</p>

<p>The Masters Project will consist of implementing a modular and extendable library of safe imitation learning algorithms and evaluating them on a Beam Tracking scenario defined within 6G SENTINEL research project.</p>

<p><strong>Main contact at the department: </strong><a href="mailto:christopher.mutschler@iis.fraunhofer.de">Dr.-Ing. Christopher Mutschler</a></p>

