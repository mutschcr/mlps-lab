<td>
<strong>Safe IL for Beam Tracking: </strong>Application of the defined algorithms for the Beam Tracking problem. Here, the simulator and already available OpenAI Gym environment from 6G SENTINEL project will be utilized. The most suitable policy type (FFN or CNN with or without frame stacking vs LSTM) will be determined and a comprehensive hyper-parameter search/tuning process will be performed to ensure the final performance of the available algorithms.</td>
