<p class="wp-block-paragraph">Thesis available for download here: <a href="https://download.cmutschler.de/thesis/2022-Parthasarathy.pdf">Dinesh Parthsarathy: Safe Monte Carlo Tree Search using Learned Safety Critics</a></p>

<h4 class="wp-block-heading">Background</h4>

<div style="text-align: justify;"><span style="font-size: revert;">Reinforcement Learning and planning are two research fields that have shown great success in sequential decision making [1]. It is common to model the decision-making task as a partially observable Markov decision process (POMDP). Monte Carlo Tree Search (MCTS) algorithms are effective at solving POMDP problems defined over large state spaces [2]. MCTS is a decision-making algorithm that searches across large combinatorial spaces represented by trees. The vanilla MCTS fails to deliver satisfactory results for problems having a high combinatorial complexity. Many modifications and enhancements have been proposed to the classical MCTS algorithm to reduce the complexity of such problems [3]. With the advent of deep learning, using neural networks as heuristics has proven to be very effective at reducing the search space. This has been the backbone of the approach used by DeepMind to solve the game of Go [4], considered to be one of the major breakthroughs in Artificial Intelligence(AI).</span></div>
<div>
<p style="text-align: justify;"><span lang="EN-US">In many real-world environments, like autonomous vehicles, autonomous agents can only explore and learn under strict safety constraints. This setting is known as safe exploration, and has attracted multiple solutions both in model-free [12, 14] and model-based settings [5, 8, 9]. In general, model-based methods have the benefit of higher sample efficiency, which reduces the number of environment interactions (and constraint violations) required during training. This thesis hypothesizes that existing safety mechanisms for MCTS are inadequate, and proposes a different solution. </span></p>
</div>

<h4 class="wp-block-heading">Problem</h4>

<p style="font-weight: 400; text-align: justify;">MCTS uses a forward model during rollouts. When exploring in real systems, these forward models experience a large error that increases with the lookahead horizon. This compounding error means that MCTS cannot by itself provide safety guarantees., which makes the approach unsuitable for the safe exploration setting.</p>
<p style="font-weight: 400; text-align: justify;">To ensure safe decision-making, previous approaches in safety-critical systems rely on expert knowledge or rules to mask unsafe actions [5], [6], [7]. Other model-free reinforcement algorithms fall back on MCTS in risky states for safe action searching. The safe exploration module based on MCTS relies on expert knowledge to identify risky states and returns negative rewards during backpropagation so that these states are less favoured during planning [8]. Overall, these approaches rely on a forward prediction model to determine a risky state or an unsafe action. This model cannot be used for all scenarios and needs to be adapted for each environment. Also, the predictions only consider one-step transitions and do not account for long-term dependencies. Alternate ways to incorporate safety is using an MCTS that solves Cost-Constrained (CC) POMDPs [9]. But, additional steps in this algorithm to optimize the Linear Program (LP) induced parameters, and not being able to prune unsafe trajectories due to inaccurate Monte Carlo cost estimates lead to high computational complexity [10].  </p>

<h4 class="wp-block-heading">Approach</h4>

<div class="columns is-layout-flex columns-nowrap columns-is-layout-flex">
<div class="column is-layout-flow column-is-layout-flow">
<figure class="content-image size-full"><img fetchpriority="high" decoding="async" width="763" height="314" src="../assets/media/2022/05/mcts1.png" alt="" class="wp-image-2532" srcset="../assets/media/2022/05/mcts1.png 763w" sizes="(max-width: 763px) 100vw, 763px"><figcaption class="wp-element-caption">Fig. 1: Safe AlphaZero approach additionally collects constraint violation from the real world as part of the (s,a,r,c) tuple. This is used to train the Policy Network, Value Network, and the Safety Critic Network.</figcaption></figure>
</div>

<div class="column is-layout-flow column-is-layout-flow">
<figure class="content-image size-full is-resized"><img decoding="async" src="../assets/media/2022/05/mcts2.png" alt="" class="wp-image-2533" style="width:210px;height:210px" width="210" height="210" srcset="../assets/media/2022/05/mcts2.png 210w" sizes="(max-width: 210px) 100vw, 210px"><figcaption class="wp-element-caption">Fig. 2: Safety critic identifies branches within the search tree that are unsafe which are pruned.</figcaption></figure>
</div>
</div>

<p style="font-weight: 400; text-align: justify;">To overcome these issues, we learn a safety critic which determines whether a state, action pair would lead to unsafe behaviour [11], [12]. We use this critic as an additional constraint within the MCTS algorithm to prune unsafe trajectories [Figure 2]. This would not only ensure that the planner returns a safe policy, but also improve the efficiency of planning as the search space is reduced. A possible way to initially avoid overestimating the safety critic which might result in excessive pruning is to use the Conservative Q-learning Framework [13]. We test this algorithm by first measuring its performance in a simple grid world environment. Then, we consider a real-world task, as a use case to record our final results. The planning system for this application mimics the AlphaZero pipeline. Combining planning and learning this way, and using Neural Networks as heuristics would further narrow down the search tree. Unlike the game of Go, we have a scenario that has a continuous state space and self-play cannot be used. These deviations from the original AlphaZero algorithm are incorporated. We integrate our safety layer into this pipeline, which learns safety and hence, ensures safe-decision making [Figure 1]. As an outcome, we expect to devise a planner that has greater efficiency and better safety compared to previous approaches. We use MCTS for CC-POMDPs [9] and model-free safe reinforcement learning methods [11], [13] as baselines to compare our results. </p>

