body_html = '''
<p class="wp-block-paragraph">Foundation models (like OpenAI’s GPT-4/ChatGPT [1] or Meta’s Llama 2 [2]) have been a disruptive technology that within just few months has started to transform the modus operandi of several industries. There have been already notable applications on tax/legal [3], public health [4] and computer code generation [5] domains, among others.</p>

<p class="wp-block-paragraph">Despite their undeniable success, these models – even after being fine-tuned – are not a “one size fits them all” solution, as there are use cases (such as the positioning applications addressed in this Thesis [6]) that require a different line of thought. Here, an ideal solution/algorithm would inherently support multiple tasks during deployment, without the necessity of specialized fine-tuning:</p>

<ol class="wp-block-list">
<li>predict the current position of a user equipment (UE, e.g., a cell phone)</li>

<li>given the current UE track, generate potential future positions (i.e., generate plausible future UE tracks)</li>

<li>given a sequence of positions, generate the expected measurements (pure generative model)</li>

<li>Given a UE track with measurements but with missing ground truth labels (true positions), infer the most probable sequence of positions for the missing parts</li>

<li>given measurements and position predictions from positioning system X, provide an estimate on the achieved positioning accuracy of the system. </li>
</ol>

<p class="wp-block-paragraph">Even though notable efforts in the direction of semi-supervised learning/generative modeling for positioning systems exist [7], [8], a unified approach that can address all the above points is yet to be reported. </p>

<p class="wp-block-paragraph">In the present Thesis, we take a radical approach and formulate the given positioning problem as an offline reinforcement learning (RL) setting that falls under the partially observable Markov decision process (POMDP) class [9]. Interestingly, in this setting, we can utilize novel approaches that suggest utilization of foundation models for the robust training of multi-task, offline RL agents [10], as a starting point. Here, the state space of the POMDP contains relevant information and measurements (e.g., LOS/NLOS conditions, coarse initial position, (compressed) channel input response (CIR) information, movement type, etc.) while actions and rewards are the predicted positions and the positioning error of the system respectively.</p>

<p class="wp-block-paragraph">Our main hypothesis, that needs to be verified by the Thesis, is that by moving further from the “passive” positioning approach that relies on estimation theory towards a more “active” approach that treats the problem as a sequential decision making one, we can devise an algorithm (or a family of algorithms) that enables multi-task-aware training and addresses all five points/tasks of the ideal solution defined above.</p>

<p class="wp-block-paragraph">For the training and evaluation of the algorithm, data from a specific area under different static (geometry) and dynamic (e.g., reflection properties, movement of UEs and obstacles, etc.) will be generated using QuaDRiGa [11]. The successful completion of the Thesis would demonstrate the efficiency of the developed algorithm in all different tasks defined above, under various UE/obstacle movement patterns and environment geometries. </p>

<p class="wp-block-paragraph">The proposed work consists of the following parts:</p>

<ul class="wp-block-list">
<li>Literature review on sequence-based offline RL algorithms (1 month)</li>

<li>Selection of proper/meaningful inputs for the model/algorithm and definition of training/test scenarios for all tasks to be addressed (1 month)</li>

<li>Data generation for the training/evaluations and implementation of the equivalent OpenAI Gym/Gymnasium environments (0.5 months)</li>

<li>Design of an experimental protocol for evaluating the effect of the different model parameters/properties (0.5 months)</li>

<li>Experimental evaluation (2 months)</li>

<li>Writing of thesis (1 month)</li>
</ul>

<p class="wp-block-paragraph">The thesis must contain a detailed description of all developed and used algorithms as well as a profound result evaluation and discussion. The implemented code must be documented and provided. </p>

<p class="wp-block-paragraph"><strong>Advisors:</strong>       Dr.-Ing Christopher Mutschler (Fraunhofer IIS), Alexander Mattick (Fraunhofer IIS), Prof. Dr. Björn Eskofier (FAU)</p>

<p class="wp-block-paragraph"><strong>Student:</strong>         Stephan Geisler</p>

