body_html = '''
<p class="wp-block-paragraph">Reinforcement Learning (RL) has achieved remarkable success in various domains, from game playing to robotics. However, in safety-critical applications such as autonomous driving or medical treatment, traditional RL algorithms may lead to unsafe behavior. Safe RL aims to address this challenge by ensuring that agents operate within predefined safety constraints while maximizing their objectives.</p>

<p class="wp-block-paragraph">Successor Representations typically split the problem of learning the value of any individual state into two components. First, we have a reward prediction function which simply tries to predict the immediate utility of every state. Second, we have a successor map that predicts the future state occupancy rate when starting from the current state [1]. Most Constrained Reinforcement learning algorithms, such as CPO [2] or Chow’s CVAR method [3], rely on estimating state visitation probabilities either explicitly or implicitly. The reason for this is because to compute whether a policy violates a constraint, they need to know the likelihood a violating state is reachable by the current policy.</p>

<p class="wp-block-paragraph">Successor representations (SR) offer a promising approach to model the dynamics of the environment by estimating the probability distribution of reaching a state at any point in the future given the current state and action [1,4,5,6]. Safe RL requires methods to ensure that agents operate within safe regions of the state space. This is typically achieved by defining a safety function that assigns a safety score to each state, and agents must avoid states with negative safety scores. The successor function <img decoding="async" width="36" height="13"> can be used to determine whether a previously discovered unsafe state is reachable via the new policy. Current methods mostly rely on either Monte-Carlo estimating state visitation probabilities [2], or computing worst-case bounds based on those estimates [3]. As is usual with Monte Carle methods, such estimates are characterized by a high variance, which results in high sampling complexity and/or in and under-estimation of the true risk. </p>

<p class="wp-block-paragraph">The goal of this thesis is to instead of using Monte-Carlo to estimate the successor distribution, to learn such a distribution to yield a lower-variance estimator for policy constraint violations. Since SR decomposes the discounted constraint function and the value function into a visitation rate and a state-wise function [1,4,5,6] one can re-use the visitation rate for both value and constraint estimation. This is because the Value function V(s) and cumulative constraint function <img decoding="async" width="27" height="13">can be represented as an integral <img decoding="async" width="123" height="15">  or <img loading="lazy" decoding="async" width="126" height="15"> , respectively, where the integral can be approximated through a replay buffer of previously seen states. This reduces the usage of the value function and (multiple) constraints to a single re-weighting of the existing replay buffer by <img loading="lazy" decoding="async" width="36" height="13">. This decomposition also means that constraints/values can be added or altered online (see, for instance, [5,6]).</p>

<p class="wp-block-paragraph">The resulting lower-variance algorithm should be tested against existing CMDP algorithms (e.g.,CPO[2], Chow’s CVAR[3] method, Lagrangian penalty ) on representative environments in safety gymnasium (e.g., Push, Circle, Goal).</p>

<p class="wp-block-paragraph">The primary objective of this research is to develop novel algorithms that combine successor representations with safety-aware reinforcement learning techniques. Specifically, the time plan is as follows:</p>

<ul class="wp-block-list">
<li>Literature review (1 month)</li>

<li>Algorithm implementation and tuning (2 months)</li>

<li>Benchmarking on safety gym (2 month)</li>

<li>Writing the thesis (1 month)</li>
</ul>

<p class="wp-block-paragraph">The thesis must contain a detailed description of all developed and used algorithms as well as a profound result evaluation and discussion. The implemented code must be documented and provided. </p>

<p class="wp-block-paragraph"><strong>Advisors: </strong>Alexander Mattick (Fraunhofer IIS), Dr. Christopher Mutschler (Fraunhofer IIS), Prof. Dr. Björn Eskofier (FAU)</p>

<p class="wp-block-paragraph"><strong>Student:</strong> Michael Girstl</p>

<p class="wp-block-paragraph"><strong>Start—End:</strong>    1.11.2024 – 30.04.2025</p>

