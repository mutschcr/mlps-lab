body_html = '''
<p class="wp-block-paragraph"><strong>Motivation / Related Work</strong></p>

<p class="wp-block-paragraph">Optimizing quantum circuits is essential for various applications, such as chemical simulations, due to the inherent complexity of quantum systems and the current limitations of quantum hardware. Effective quantum simulation demands careful attention to key aspects of circuit optimization, including the reduction of gate depth and gate count to minimize errors and decoherence, as well as the efficient mapping of quantum algorithms onto available hardware.</p>

<p class="wp-block-paragraph">Reinforcement learning (RL) has emerged as a powerful tool for quantum circuit optimization, leveraging its capability to navigate and exploit complex solution spaces to enhance circuit efficiency. By treating the optimization problem as a sequential decision-making process, RL algorithms iteratively refine circuit designs through trial and error, guided by a reward signal that reflects performance metrics such as gate depth, gate count, and fidelity [1-3].</p>

<p class="wp-block-paragraph">This methodology enables RL to uncover novel optimization strategies that traditional approaches may overlook, ultimately leading to more efficient quantum computations and improved use of quantum hardware resources.</p>

<p class="wp-block-paragraph"><strong>Overall goal</strong></p>

<p class="wp-block-paragraph">The goal of this work is to train an agent via RL for the optimization of quantum circuits for chemical simulations with respect to a defined metric as reward, e.g., gate depth and gate count. The existing environment is a quantum circuit simulator that is initialized with randomly generated circuits, which the agent will then alter and optimize.</p>

<p class="wp-block-paragraph">The agent will operate within a discrete, hierarchically structured action space. First, it must select a location within the quantum circuit, and then determine the appropriate modification to apply at that location. To achieve this, the RL framework detailed in [4] will be employed, which trains agents to navigate hierarchical action spaces using an adapted version of Gumbel AlphaZero’s [5] action selection process.</p>

<p class="wp-block-paragraph">The primary task of this work involves integrating the approach from [4] with the existing quantum circuit optimization environment. This includes identifying and implementing a suitable neural network architecture (e.g., a graph neural network or a transformer) that is capable of handling variable-sized, discrete action spaces. Finally, the performance of the RL agent will be evaluated through a comparative study against other quantum circuit optimization techniques. The study should also contain an outlook on the integration of continuous actions (e.g., the rotation angle of the gates) into the framework.</p>

<p class="wp-block-paragraph"><strong>Timetable (6 months, in 24 person weeks (PW))</strong></p>

<p class="wp-block-paragraph">3 PW               Familiarization with relevant work in the subject areas and literature.</p>

<p class="wp-block-paragraph">3 PW               Conceptualization of a suitable neural network architecture for the agent.</p>

<p class="wp-block-paragraph">8 PW               Implementation of the approach in Python. The RL environment and the code for the action selection from [4] is provided to the student.</p>

<p class="wp-block-paragraph">4 PW               Experiments and refinement of the method.</p>

<p class="wp-block-paragraph">6 PW               Writing of the final transcript.</p>

<p class="wp-block-paragraph"><strong>Expected Results and Scientific Contributions</strong></p>

<ul class="wp-block-list">
<li>A Python implementation to train an agent by RL for quantum circuit optimization inside a discrete and hierarchical action space. </li>

<li>Comparative study on the performance of the agent against other approaches for quantum circuit optimization.</li>

<li>Outlook on integration of continuous actions (e.g., rotation angles of gates) into the framework.</li>
</ul>

<p class="wp-block-paragraph"><strong>Supervisors:</strong> Christopher Mutschler (Fraunhofer IIS), Quirin Göttl (Fraunhofer IIS), Maniraman Periyasamy (Fraunhofer IIS), Prof. Dr. Björn Eskofier (FAU)</p>

