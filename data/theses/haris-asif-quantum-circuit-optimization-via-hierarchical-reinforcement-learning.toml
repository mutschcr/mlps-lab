<p class="wp-block-paragraph">[2]       Ostaszewski, M., Trenkwalder, L.M., Masarczyk, W., Scerri, E., &amp; Dunjko, V., 2021. Reinforcement learning for optimization of variational quantum circuit architectures. <em>Advances in Neural Information Processing Systems 34 (NeurIPS).</em></p>

<p class="wp-block-paragraph">[3]       Preti, F., Schilling, M., Jerbi, S., Trenkwalder, L., Nautrup, H., Motzoi, F., &amp; Briegel, H., 2024. Hybrid discrete-continuous compilation of trapped-ion quantum circuits with deep reinforcement learning. <em>Quantum</em>, 8, 1343.</p>

<p class="wp-block-paragraph">[4]       Göttl, Q., Asif, H., Mattick, A., Marzilger, R., &amp; Plinge, A., 2024. Automated Design in Hybrid Action Spaces by Reinforcement Learning and Differential Evolution. <em>47th German Conference on Artificial Intelligence</em>.</p>

