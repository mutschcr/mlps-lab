<div>
<p><span lang="EN-US">This project should investigate what effect a local Lipschitzness constraint (see the visualization in </span>Figure 1<span lang="EN-US">) or domain randomization on the original policy has on the generated policies. For an environment that is easily visualized, policies should be trained with the above additions and visualized. In particular, the decision boundaries are of interest here (see the overfitted decision boundary in Figure 2). In terms of robustness, the policy may be more robust to slight variations of the environment dynamics (so-called <i>model mismatches</i>). In contrast, in terms of explainability, smooth and wide boundaries (see Figure 3) may lead to an easier extraction of rule-based (e.g., decis</span><span lang="EN-US">ion tree) policies (e.g. through [1]).</span></p>
<div>
