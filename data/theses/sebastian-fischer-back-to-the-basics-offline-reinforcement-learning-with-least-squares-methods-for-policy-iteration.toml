body_html = '''
<p>Recently, offline (sometimes also called ‘batch’) Reinforcement Learning (RL) algorithms have gained significant research traction [1]. The reason behind this is that – unlike in the classical Reinforcement Learning formulation – they do not require interaction with the environment. Instead, when provided with logged data they are able to generate a better policy than the one used to collect the data. Obviously, this has significant practical applications, e.g., we could learn a better driving policy using only recorded data from real drivers.</p>
<p>Even though offline RL algorithms are appealing, they can be quite unstable during training. The main reason behind this instability is the bootstrapping error [4]. Here, the problem is that the state-action values can be overestimated in regions far from the actually experienced data, which leads to erroneous target updates [3].</p>
<p>In value-based RL, two ways to mitigate this problem have been proposed. The first approach tries to penalize policies (or actions selected to specific states be more precise) that are not included in the original data (or the specific action has very low probability according to the data) [2,3]. A different approach facilitates an ensemble of models and through a form of dropout ensures that outlier values for the state-action value function are cancelled out.</p>
<p>Even though these approaches are in-line with recent deep RL algorithms, we have to consider that there is a family of classical offline RL methods (e.g. see [5,6]) that have shown remarkable results and stable performance, even though they are based in linear function approximation for the state-action value function. So, the question here is whether we can combine the theory and findings of classical algorithms with modern deep learning and reinforcement learning techniques.</p>
<p>The main goal of this thesis is to analyze the properties of the Least Squares Policy Iteration (LSPI) algorithm [5] and design a new deep RL offline algorithm based on key properties and insights of LSPI. For example, Radial Basis Function (RBF) approximators can be used to avoid the extrapolation error in the state-action value function, the widely-used Q-learning loss function could be replaced by the LSPI state-action approximator weight update, the benefits of having a multi-head network for providing different weights for each set of actions could be explored, while the added benefits of pre-training with Behavioral Cloning (BC) should be determined.</p>
<p>The new algorithm should be benchmarked against state-of-the-art results [2,3,4] both in classical control environments and the offline Atari Games dataset. [7]. In addition, the possibility of extending the algorithm to continuous action spaces should be explored.</p>
<p><strong>Supervisors:</strong> <a href="mailto:georgios.kontes@iis.fraunhofer.de">Dr. Georgios Kontes</a>, <a href="mailto:christopher.mutschler@iis.fraunhofer.de">Dr.-Ing. Christopher Mutschler</a></p>

