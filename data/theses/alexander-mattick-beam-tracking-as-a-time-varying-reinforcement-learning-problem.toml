<strong>Beam Tracking as non-stationary RL environment:</strong> The Beam Tracking problem will be transformed to an equivalent RL problem with non-stationary environment. Here, a direction would be to define the quality of each beam in the codebook as the equivalent of a grid-world environment [2] and as the UE moves assume that the dynamics of the environment change, and the goal position of the grid (best beam in codebook) shifts to another cell. </td>
