<strong>Implementation: </strong>Application of the defined algorithms for the Beam Tracking problem. Here, the simulator and already available OpenAI Gym environment from 6G SENTINEL project will be utilized. The most suitable policy type (FFN or CNN with or without frame stacking vs LSTM) as well as environment detection algorithm will be determined and properly tuned.</td>
</tr>
