body_html = '''
<div class="layoutArea">
<div class="column">
<p><span style="font-size: revert;">Reinforcement Learning (RL) builds on the idea that an agent learns an optimal behavior through iterative interaction with an environment. In model-free reinforcement learning the agent does not have access to the world knowledge (i.e., to the reward process and environment dynamics) and its task is to deduce an optimal behavior, i.e., a policy, solely through receiving observations and rewards as a consequence of actions being taken. Model-free RL has achieved tremendous results in a variety of tasks ranging from robotics control (Schulman, 2015), supply chain management (Valluri, 2009), helicopter control (Kim, 2003) and games (Mnih, 2013).</span></p>
</div>
</div>
<div class="layoutArea">
<div class="column">
<p>However, these remarkable results come with the cost of sampling efficiency. In practice, learning good controllers for such applications requires a good balance between exploration and exploitation, and in many cases, simulators are not available or not accurate enough. However, exploration in the real world might not be a good option for many use cases. Consider for instance the helicopter application from above. Finding a good policy that successfully flies complex maneuvers (without any prior knowledge or expert behavior) requires exploration which can easily lead to damage to the real helicopter (Kim, 2003). In practice usually such policies are generated through the imitation learning of expert behavior. Here, we either make use of <em>behavioral cloning </em>(Sakmann and Gruben-Trejo, 2016) i.e., we try to <em>copy</em> the expert, or <em>inverse reinforcement learning </em>(Abbeel, 2012), i.e., we try to estimate the reward function which is being optimized by the expert. However, the performance of the policies derived from both of these methods is bounded by the underlying expert policies.</p>
<p>Instead, <em>offline reinforcement learning</em> (Levine, 2020; Kumar, 2019; Seita, 2020) approaches a slightly similar problem in a different way. The idea of offline RL is to use existing rollouts/trajectories that have been generated under many sub-optimal baseline policies, i.e., “good” controllers in order to generate an overall better policy. A practical example comes from autonomous driving (Levine, 2019). Here, we aim to use rollouts (state-action-reward sequences) from different controllers (drivers) to learn a policy that is a superior driver than the baseline controllers. Offline RL only uses existing data and transfers the RL problem into a supervised learning setting (i.e., <em>data-driven reinforcement learning</em>) and has received an increasing interest lately (Fujimoto, 2019a; Fujimoto, 2019b; Agarwal, 2020), as available rollouts exist more and more in a variety of applications.</p>
</div>
</div>

<h4 class="wp-block-heading"><strong>Task definition</strong></h4>

<p>The goal of this thesis is to evaluate existing offline reinforcement learning algorithms on a variety of available environments in the Coach framework (Caspi, 2017). First, the thesis should line out the necessary requirements that are needed for the development of offline RL (e.g. interfaces to monitoring applications such as Tensorboard (<a href="https://www.tensorflow.org/tensorboard">https://www.tensorflow.org/tensorboard</a>), MLflow (<a href="https://mlflow.org/">https://mlflow.org</a>), Coach Dashboard (<a href="https://nervanasystems.github.io/coach/dashboard.html">https://nervanasystems.github.io/coach/dashboard.html</a>), OpenShift with ML Lifecycle (<a href="https://www.openshift.com/learn/topics/ai-ml">https://www.openshift.com/learn/topics/ai-ml</a>)  (<a href="https://www.openshift.com/">https://www.openshift.com</a>) <a href="https://www.openshift.com/">OpenShift</a>? (with <a href="https://www.openshift.com/learn/topics/ai-ml">ML Lifecycle</a>) or others, data handling, access to databases, etc.) and evaluate the algorithms implemented in Coach against available implementations on other frameworks. Second, the thesis should integrate publicly available offline RL algorithms (such as Naïve RL (e.g. DQN, QR-DQN (https://nervanasystems.github.io/coach/components/agents/value_optimization/qr_dqn.html)), batch-constrained Q-learning (BCQ) (Fujimoto, 2019a), bootstrapping error accumulation reduction (BEAR) (Kumar, 2019), behavioral cloning baselines, etc.), select reasonable environments that pose different challenges, and implement relevant metrics to benchmark the algorithms. Third, the thesis should evaluate and interpret experimental results from the offline RL algorithms on the selected environments using the implemented metrics. As a last step, the thesis should use available rollouts that are generated by policies that are used in an autonomous driving application in the Carla simulator. As only the datasets are used, there is no need to implement an interface to Carla.</p>
<p><strong>Milestones:</strong></p>
<ul>
<li>Literature review (Batch/Offline RL baselines algorithms, coach environment); compare the capabilities of coach to different frameworks (on the basis of their specifications, not through implementation and actual benchmarks) that allow for offline RL</li>
<li>Selecting benchmark environments and configurations</li>
<li>Design and implementation of a benchmarking suite</li>
<li>Integrating baselines algorithms and coach into the benchmarking suite</li>
<li>Design and run experiments to evaluate the behavior of the offline RL algorithms</li>
<li>Evaluate coach and offline RL on rollouts from an autonomous driving application that runs in the Carla simulator</li>
</ul>
<p><strong>Requirements: </strong>Python programming, RL.</p>
<p><strong>Supervisors:</strong> <span style="font-size: inherit; font-family: inherit;">Dr. <a href="mailto:georgios.kontes@iis.fraunhofer.de">Georgios Kontes</a> (IIS), Dr.-Ing. </span><a href="mailto:christopher.mutschler@iis.fraunhofer.de">Christopher Mutschler</a> (IIS)</p>

