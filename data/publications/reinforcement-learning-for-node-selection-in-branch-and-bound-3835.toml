title = "Reinforcement Learning for Node Selection in Branch-and-Bound"
authors = ["Alexander Mattick", "Christopher Mutschler"]
date = "2024-01-01"
venue = "Transactions on Machine Learning Research (TMLR)"
profiles = ["alexander-mattick", "christopher-mutschler"]
abstract = '''
We train a graph neural network that produces a probability distribution based on the path from the model's root to its ``to-be-selected'' leaves. Representing node-selection as a probability distribution allows us to train a decision-making policy using state-of-the-art RL techniques that capture both intrinsic node-quality and node-evaluation costs.
Our method induces a high quality node selection policy on a set of varied and complex problem sets, despite only being trained on specially designed, synthetic travelling salesmen problem (TSP) instances.'''
