title = "A Survey on Quantum Reinforcement Learning"
authors = ["Nico Meyer", "Christian Ufrecht", "Maniraman Periyasamy", "Daniel D Scherer", "Axel Plinge", "Christopher Mutschler"]
date = "2022-09-20"
venue = "arXiv"
profiles = ["nico-meyer", "christopher-mutschler"]
abstract = "We intend to provide a broad overview of the literature on quantum reinforcement learning and put particular emphasis on recent developments. With a focus on already available noisy intermediate-scale quantum devices, these include variational quantum circuits acting as function approximators in an otherwise classical reinforcement learning setting. We provide both a birds-eye-view of the field, as well as summaries and reviews for selected parts of the literature."
