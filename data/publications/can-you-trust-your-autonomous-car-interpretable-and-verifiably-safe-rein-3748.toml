title = "Can You Trust Your Autonomous Car? Interpretable and Verifiably Safe Reinforcement Learning"
authors = ["Lukas M Schmidt", "Georgios Kontes", "Axel Plinge", "Christopher Mutschler"]
date = "2021-01-01"
venue = "32nd IEEE Intelligent Vehicles Symposium"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IV48863.2021.9575328"
abstract = "We introduce a novel pipeline that builds on recent advances in imitation learning and that can generate safe and efficient behavior policies. We combine an RL step that solves for safe behavior through the introduction of safety distances with a subsequent innovative safe extraction of decision tree policies. The resulting decision tree is not only easy to interpret, it is also safer than the neural network policy trained for safety. Additionally, we formally prove the safety of trained RL agents for linearized system dynamics, showing that the learned and extracted policy successfully avoids all catastrophic events."
