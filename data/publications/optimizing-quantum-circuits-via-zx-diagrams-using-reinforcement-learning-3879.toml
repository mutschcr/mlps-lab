title = "Optimizing quantum circuits via zx diagrams using reinforcement learning and graph neural networks"
authors = ["Alexander Mattick", "Maniraman Periyasamy", "Christian Ufrecht", "Abhishek Y Dubey", "Christopher Mutschler", "Axel Plinge", "Daniel D Scherer"]
date = "2025-09-20"
venue = "arXiv"
profiles = ["christopher-mutschler", "alexander-mattick"]
abstract = "We introduce a framework based on ZX calculus, graph-neural networks and reinforcement learning for quantum circuit optimization. By combining reinforcement learning and tree search, our method addresses the challenge of selecting optimal sequences of ZX calculus rewrite rules. Instead of relying on existing heuristic rules for minimizing circuits, our method trains a novel reinforcement learning policy that directly operates on ZX-graphs, therefore allowing us to search through the space of all possible circuit transformations to find a circuit significantly minimizing the number of CNOT gates. This way we can scale beyond hard-coded rules towards discovering arbitrary optimization rules. We demonstrate our method's competetiveness with state-of-the-art circuit optimizers and generalization capabilities on large sets of diverse random circuits."
