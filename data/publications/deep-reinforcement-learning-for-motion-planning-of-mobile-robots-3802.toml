title = "Deep Reinforcement Learning for Motion Planning of Mobile Robots"
authors = ["Leonid Butyrev", "Thorsten Edelhäußer", "Christopher Mutschler"]
date = "2019-01-01"
venue = "arXiv"
profiles = ["christopher-mutschler"]
abstract = "We present a novel motion and trajectory planning algorithm for nonholonomic mobile robots that uses recent advances in deep reinforcement learning. Starting from a random initial state, i.e., position, velocity and orientation, the robot reaches an arbitrary target state while taking both kinematic and dynamic constraints into account. Our deep reinforcement learning agent not only processes a continuous state space it also executes continuous actions, i.e., the acceleration of wheels and the adaptation of the steering angle. We evaluate our motion and trajectory planning on a mobile robot with a differential drive in a simulation environment."
