title = "Uncertainty-based fingerprinting model selection for radio localization"
authors = ["Maximilian Stahlke", "Tobias Feigl", "Sebastian Kram", "Bjoern M Eskofier", "Christopher Mutschler"]
date = "2023-01-01"
venue = "2023 13th International Conference on Indoor Positioning and Indoor Navigation (IPIN)"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/IPIN57070.2023.10332531"
abstract = "In this paper we propose methods for uncertainty estimation of AI-based fingerprinting to determine its validity. Our experiments show that we can implicitly switch between classic and fingerprinting-based approaches to reliably estimate accurate positions, even in NLoS-dominated radio environments. Our approach works even if the AI models are only trained on radio data in certain areas of the environment. In contrast to the state-of-the-art, our approach intrinsically identifies the spatial boundaries of the AI model, and thus does not require prior area identification."
