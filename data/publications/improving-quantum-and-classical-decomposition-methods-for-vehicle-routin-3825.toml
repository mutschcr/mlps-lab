title = "Improving quantum and classical decomposition methods for vehicle routing"
authors = ["Laura S Herzog", "Friedrich Wagner", "Christian Ufrecht", "Lilly Palackal", "Axel Plinge", "Christopher Mutschler", "Daniel D Scherer"]
date = "2024-01-01"
venue = "arXiv"
profiles = ["christopher-mutschler"]
abstract = "We demonstrate the utility of our novel shrinking method by successfully applying it to the archetypical traveling salesperson problem (TSP) which often occurs as a sub-problem in practically relevant vehicle routing applications. For a TSP with seven cities, we are able to retrieve an optimum solution by consecutively running two 7-qubit QAOA circuits. Without decomposition methods, we would require five times as many qubits. Our results offer insights into the performance of algorithms for combinatorial optimization problems within the constraints of current quantum technology."
