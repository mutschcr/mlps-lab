title = "Indoor Localization with Robust Global Channel Charting: A Time-Distance-Based Approach"
authors = ["Maximilian Stahlke", "George Yammine", "Tobias Feigl", "Bjoern M Eskofier", "Christopher Mutschler"]
date = "2023-01-01"
venue = "IEEE Transactions on Machine Learning in Communications and Networking (TMLCN)"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/TMLCN.2023.3256964"
abstract = '''
We propose a novel distance metric for CC that approaches a global linear correlation to the physical distance based on time-synchronized single-input/single-output (SISO) CSIs. This allows to learn the environment’s global geometry in a channel chart without annotations.

Dataset here: https://www.iis.fraunhofer.de/en/ff/lv/dataanalytics/pos/fingerprinting-dataset-for-positioning.html'''
