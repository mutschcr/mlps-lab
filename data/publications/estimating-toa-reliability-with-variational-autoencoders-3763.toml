title = "Estimating TOA Reliability with Variational Autoencoders"
authors = ["Maximilian Stahlke", "Sebastian Kram", "Felix Ott", "Tobias Feigl", "Christopher Mutschler"]
date = "2021-01-01"
venue = "IEEE Sensors Journal"
profiles = ["christopher-mutschler"]
doi = "https://doi.org/10.1109/JSEN.2021.3101933"
abstract = "We propose to use generative deep learning models for out-of-distribution detection based on channel impulse responses (CIRs). We use a Variational Autoencoder (VAE) to predict an anomaly score for the channel of a TOF-based Ultra-wideband (UWB) system. Our experiments show that a VAE trained only on line-of-sight (LOS) training data generalizes well to new environments and detects non-line-of-sight CIRs with an accuracy of 85%. We also show that integrating our anomaly score into a TOF-based extended Kalman filter (EKF) improves tracking performance by over 25%."
