<main id="content" class="site-content" role="main" itemscope itemtype="https://schema.org/Blog">
<!-- mlps-generated-news-article -->
  <article class="sinatra-article post type-post format-standard hentry category-news" itemscope itemtype="https://schema.org/CreativeWork">
    <div class="post-category">
      <span class="cat-links"><span class="screen-reader-text">Posted in</span><span><a href="./">News</a></span></span>

      <h1 class="entry-title" itemprop="headline">$headline</h1>

    $photos
    <div class="entry-content si-entry" itemprop="text">
$article
    </div>
  </article>
</main>
